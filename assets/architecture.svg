<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" width="1040" height="440" role="img" aria-label="NexaMind architecture">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060912"/>
      <stop offset="100%" stop-color="#0c1730"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#06b6d4;#22c55e;#6366f1" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#22c55e;#6366f1;#06b6d4" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="dbfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13314a"/>
      <stop offset="100%" stop-color="#0e2233"/>
    </linearGradient>
    <linearGradient id="vecfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123a3a"/>
      <stop offset="100%" stop-color="#0d2a2a"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#16213f" stroke-width="1"/>
    </pattern>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <style>
    @keyframes drift { 0%{transform:translate(0,0)} 50%{transform:translate(20px,-14px)} 100%{transform:translate(0,0)} }
    @keyframes dash { to { stroke-dashoffset: -120; } }
    @keyframes blink { 0%,100%{opacity:.35;r:4} 50%{opacity:1;r:7} }
    @keyframes sweep { 0%{transform:translateX(-320px)} 100%{transform:translateX(1140px)} }
    .drift{animation:drift 11s ease-in-out infinite}
    .flow{stroke-dasharray:8 10;animation:dash 4s linear infinite}
    .b1{animation:blink 2.8s ease-in-out infinite}
    .b2{animation:blink 2.8s ease-in-out infinite .7s}
    .b3{animation:blink 2.8s ease-in-out infinite 1.4s}
    .sweep{animation:sweep 7s linear infinite}
  </style>

  <rect width="1040" height="440" rx="18" fill="url(#abg)"/>
  <rect width="1040" height="440" rx="18" fill="url(#grid)"/>
  <g class="drift"><circle cx="180" cy="90" r="200" fill="url(#bloom)"/></g>
  <g class="drift"><circle cx="900" cy="380" r="200" fill="url(#bloom)"/></g>
  <rect x="0" y="0" width="1040" height="4" fill="url(#accent)"/>

  <text x="52" y="52" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="url(#accent)">System architecture</text>
  <text x="52" y="76" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#7c8bab">One service, one graph, three stateful stores.</text>

  <g stroke="#2a3b57" stroke-width="2">
    <line x1="212" y1="230" x2="290" y2="230"/>
    <line x1="462" y1="230" x2="540" y2="230"/>
    <line x1="712" y1="230" x2="812" y2="110"/>
    <line x1="712" y1="230" x2="812" y2="230"/>
    <line x1="712" y1="230" x2="812" y2="350"/>
  </g>

  <g fill="#22c55e">
    <circle r="4"><animateMotion dur="1.5s" repeatCount="indefinite" path="M214 230 L288 230"/></circle>
    <circle r="4"><animateMotion dur="1.5s" begin="0.35s" repeatCount="indefinite" path="M464 230 L538 230"/></circle>
  </g>
  <g fill="#06b6d4">
    <circle r="4"><animateMotion dur="1.7s" begin="0.1s" repeatCount="indefinite" path="M714 230 L810 110"/></circle>
    <circle r="4"><animateMotion dur="1.7s" begin="0.55s" repeatCount="indefinite" path="M714 230 L810 230"/></circle>
    <circle r="4"><animateMotion dur="1.7s" begin="1s" repeatCount="indefinite" path="M714 230 L810 350"/></circle>
  </g>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <rect x="40" y="195" width="172" height="70" rx="14" fill="#111827" stroke="#2a3b57"/>
    <text x="126" y="236" font-size="15" fill="#e2e8f0">Next.js UI</text>

    <rect x="290" y="195" width="172" height="70" rx="14" fill="#111827" stroke="#2a3b57"/>
    <text x="376" y="230" font-size="15" fill="#e2e8f0">FastAPI</text>
    <text x="376" y="250" font-size="11" fill="#64748b">REST and SSE</text>

    <rect x="540" y="195" width="172" height="70" rx="14" fill="#111827" stroke="url(#accent)"/>
    <text x="626" y="230" font-size="15" fill="#e2e8f0">LangGraph</text>
    <text x="626" y="250" font-size="11" fill="#64748b">retrieve and generate</text>
  </g>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <rect x="812" y="72" width="188" height="76" rx="14" fill="#111827" stroke="#2a3b57"/>
    <text x="906" y="106" font-size="15" fill="#e2e8f0">Gemini</text>
    <text x="906" y="127" font-size="11" fill="#64748b">reasoning and embeddings</text>
    <circle class="b1" cx="832" cy="90" r="5" fill="#22c55e"/>

    <g>
      <path d="M812 205 h188 v40 a94 14 0 0 1 -188 0 z" fill="url(#dbfill)" stroke="#2a3b57"/>
      <ellipse cx="906" cy="205" rx="94" ry="14" fill="#1a3a56" stroke="#2a3b57"/>
      <text x="906" y="240" font-size="15" fill="#e2e8f0">PostgreSQL</text>
      <text x="906" y="260" font-size="11" fill="#64748b">document metadata</text>
      <circle class="b2" cx="832" cy="236" r="5" fill="#22c55e"/>
    </g>

    <g>
      <path d="M812 325 h188 v40 a94 14 0 0 1 -188 0 z" fill="url(#vecfill)" stroke="#1f5a5a"/>
      <ellipse cx="906" cy="325" rx="94" ry="14" fill="#155e5e" stroke="#1f5a5a"/>
      <text x="906" y="360" font-size="15" fill="#e2e8f0">Qdrant</text>
      <text x="906" y="380" font-size="11" fill="#64748b">vector index</text>
      <circle class="b3" cx="832" cy="356" r="5" fill="#22c55e"/>
    </g>
  </g>

  <text x="520" y="420" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">ingest writes to Postgres and Qdrant; query reads from both in a single graph run</text>

  <rect class="sweep" x="0" y="436" width="300" height="3.5" rx="1.75" fill="url(#accent)"/>
</svg>

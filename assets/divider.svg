<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 22" width="1200" height="22" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#6366f1"/>
      <stop offset="0.6" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes slide { 0%{transform:translateX(-200px)} 100%{transform:translateX(200px)} }
    .s{animation:slide 6s linear infinite}
  </style>
  <line x1="60" y1="11" x2="1140" y2="11" stroke="#182441" stroke-width="2" stroke-linecap="round"/>
  <g class="s">
    <line x1="60" y1="11" x2="1140" y2="11" stroke="url(#dg)" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
